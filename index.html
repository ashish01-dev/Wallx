<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallx — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0d1117;
      color: #e8e4dc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('attached_assets/wallhaven-qrmjwl_1786017608046.jpg');
      background-size: cover;
      background-position: center 40%;
      background-repeat: no-repeat;
      z-index: 0;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10, 14, 26, 0.35) 0%,
        rgba(10, 14, 26, 0.20) 40%,
        rgba(10, 14, 26, 0.65) 80%,
        rgba(10, 14, 26, 0.92) 100%
      );
    }

    /* Layout */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem 6rem;
      gap: 1.6rem;
    }

    .logo-mark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 18vw, 13rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #ffffff;
      text-shadow: 0 0 120px rgba(160, 180, 240, 0.5), 0 4px 40px rgba(0,0,0,0.4);
      line-height: 0.9;
    }

    .logo-mark span {
      color: rgba(255,255,255,0.38);
    }

    .divider {
      width: 52px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    }

    .tagline {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1rem, 3vw, 1.4rem);
      font-weight: 700;
      color: rgba(232, 228, 220, 0.82);
      letter-spacing: 0.02em;
      line-height: 1.4;
      max-width: 480px;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.72rem, 1.8vw, 0.8rem);
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(200, 215, 255, 0.5);
      margin-top: 0.2rem;
    }

    /* Notify badge */
    .notify-badge {
      margin-top: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.4rem;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 100px;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(220,230,255,0.6);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6ec6a0;
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem 2rem 2.2rem;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .footer-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.45);
    }

    .footer-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }

    .footer-links a {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(200,215,255,0.35);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: rgba(200,215,255,0.7);
    }

    .footer-copy {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: rgba(200,215,255,0.3);
    }

    .footer-copy .copy-icon {
      font-style: normal;
    }

    @media (max-width: 480px) {
      .footer-links {
        gap: 1.2rem;
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="page">
    <main class="hero">
      <div class="logo-mark">Wall<span>x</span></div>
      <div class="divider"></div>
      <p class="tagline">Something beautiful is on its way.</p>
      <p class="subtitle">Launching soon &nbsp;·&nbsp; Stay tuned</p>
      <div class="notify-badge">
        <span class="dot"></span>
        In development
      </div>
    </main>

    <footer>
      <div class="footer-brand">Wallx</div>
      <ul class="footer-links">
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Privacy</a></li>
      </ul>
      <p class="footer-copy">
        <i class="copy-icon">©</i> 2026 Ashish. All rights reserved.
      </p>
    </footer>
  </div>

</body>
</html>
