<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallx — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0d1117;
      color: #e8e4dc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('attached_assets/ChatGPT_Image_Aug_6,_2026,_05_48_37_PM_1786018735304.png');
      background-size: cover;
      background-position: center 40%;
      background-repeat: no-repeat;
      z-index: 0;
      filter: brightness(0.88);
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10, 14, 26, 0.72) 0%,
        rgba(10, 14, 26, 0.62) 40%,
        rgba(10, 14, 26, 0.80) 80%,
        rgba(10, 14, 26, 0.96) 100%
      );
    }

    /* Layout */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem 6rem;
      gap: 1.6rem;
    }

    .logo-mark {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-shadow: 0 0 120px rgba(160, 180, 240, 0.4), 0 4px 40px rgba(0,0,0,0.3);
      line-height: 0.9;
    }

    .logo-mark span {
      color: rgba(255,255,255,0.38);
      font-weight: 400;
    }

    .divider {
      width: 52px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    }

    .tagline {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.9rem, 2.2vw, 1.1rem);
      font-weight: 400;
      color: rgba(232, 228, 220, 0.75);
      letter-spacing: 0.01em;
      line-height: 1.4;
      max-width: 480px;
    }

    .subtitle {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.65rem, 1.4vw, 0.72rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(200, 215, 255, 0.45);
      margin-top: 0.2rem;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.4rem 2rem;
      border-top: none;
    }

    .footer-copy {
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: rgba(200,215,255,0.35);
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="page">
    <main class="hero">
      <div class="logo-mark">Wall<span>x</span></div>
      <div class="divider"></div>
      <p class="tagline">Something beautiful is on its way.</p>
      <p class="subtitle">Launching soon &nbsp;·&nbsp; Stay tuned</p>
    </main>

    <footer>
      <p class="footer-copy">© 2026 Copyright Ashish</p>
    </footer>
  </div>

</body>
</html>
